# Approved quotations for direct use in editorial and press coverage.

items:
  - "I fondly remember the technologies of my teenage years: media was still physical—floppy disks, game cartridges—and batteries were still replaceable. I had a Casio watch to tell the time, a PlayStation to pass it, and a DiscMan to pause it."

  - "NoGood has no clear beginning. When I close my eyes and retrace my steps, I see the internet of the ’90s and ’00s. I see myself in a room, drawing obsessively. Sitting at a computer, clicking a mouse, surfing the World Wide Web."

  - "Bitcoin embodied the same qualities that had fascinated me about the internet all those years before it. Here, unexpectedly, was a technology as clunky, experimental and strange as the hardware I’d loved twenty years earlier, yet filled with the same sense of possibility. A glimmer of excitement in a Web that had become repetitive and predictable."

  - "This book, in its own right, marks an important moment for me. Very much the present-day version of the craft envelope with drawings I used to carry around, it sheds some light on my process and work, and pulls back the curtain on the creation of NoGood and the technologies that influenced it."